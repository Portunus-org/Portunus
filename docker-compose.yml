# Portunus: a single service. The Go control plane with the embedded web UI
# supervises sing-box as a child process; state lives on a named volume.
#
#   docker compose up -d
#   docker compose logs portunus | grep password     # initial admin password
#   ssh -L 2053:127.0.0.1:2053 user@server           # then open http://localhost:2053
services:
  portunus:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: portunus:local
    container_name: portunus
    # Host networking: proxy inbounds (TCP and QUIC/UDP) are created at runtime
    # on arbitrary ports, and bypassing docker-proxy/NAT matters at 1 Gbit/s.
    network_mode: host
    restart: unless-stopped
    # Values come from .env (see .env.example); the defaults below apply
    # when it is absent.
    environment:
      # Loopback only. Reach the panel through an SSH tunnel.
      PORTUNUS_LISTEN: ${PORTUNUS_LISTEN:-127.0.0.1:2053}
      PORTUNUS_LOG_LEVEL: ${PORTUNUS_LOG_LEVEL:-info}
      PORTUNUS_LOG_FORMAT: ${PORTUNUS_LOG_FORMAT:-json}
      PORTUNUS_COOKIE_SECURE: ${PORTUNUS_COOKIE_SECURE:-auto}
      PORTUNUS_SUB_LISTEN: ${PORTUNUS_SUB_LISTEN:-}
    volumes:
      - portunus-data:/var/lib/portunus
      # Existing certificates (certbot, Nginx Proxy Manager…), read-only:
      # - /etc/letsencrypt:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Everything dropped except binding ports below 1024, which the sing-box
    # binary receives through a file capability. File capabilities do not
    # work under no-new-privileges, so that option is intentionally absent.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  portunus-data:
