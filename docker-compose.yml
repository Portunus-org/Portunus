services:
  portunus:
    image: ghcr.io/paulichp/portunus:latest
    container_name: portunus
    restart: unless-stopped
    network_mode: host
    volumes:
      - portunus-data:/var/lib/portunus
      - portunus-update:/run/portunus-update

  updater:
    image: ghcr.io/paulichp/portunus-node:latest
    container_name: portunus-updater
    command: ["updater", "portunus"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    user: "0"
    volumes:
      - /var/run/docker.sock:/run/docker.sock
      - portunus-update:/run/portunus-update

volumes:
  portunus-data:
  portunus-update:
