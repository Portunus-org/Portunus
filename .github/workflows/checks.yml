# What has to pass before dev can be merged into main: the pull request is
# scanned, and a HIGH or CRITICAL finding fails its check.
#
#   sast     static analysis of the code (Semgrep)
#   sca      known vulnerabilities in the dependencies (govulncheck, pnpm
#            audit, Trivy) and secrets in the whole history (gitleaks)
#   images   both images built and scanned as they would be published (Trivy)
#   dast     the panel, started from its image, probed from outside (ZAP)
#   source   main takes changes from dev only
#
# The branch rule of main (.github/rulesets/main.json) requires all five.
# Accepted findings are listed with their reasons in .trivyignore and
# .zap/rules.tsv.
name: checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The images the release builds with (deploy/Dockerfile) and the tools,
  # each pinned by digest.
  GO_IMAGE: golang:1.27.2-alpine3.24@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
  NODE_IMAGE: node:26.9.0-alpine3.24@sha256:dbaa92e5758cbbcf85d65d5403fdb530fe3442cbe8c6dbfb7ef23365450d5070
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  SEMGREP_IMAGE: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  PNPM_VERSION: 12.6.0

jobs:
  source:
    name: source
    runs-on: ubuntu-latest
    steps:
      - name: main takes changes from dev only
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Pull requests into main come from dev. Open this one against dev."
            exit 1
          fi

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off --error \
            --config p/default --config p/golang --config p/typescript --config p/react \
            --config p/nextjs --config p/secrets --config p/dockerfile --config p/github-actions \
            --exclude node_modules --exclude .next --exclude out .

  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history, for the secret scan
      - name: Go modules (govulncheck, only what the code reaches)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/server "$GO_IMAGE" sh -euc \
            'go run "$0" -tags noui ./...' "$GOVULNCHECK"
      - name: Web packages (pnpm audit)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/web "$NODE_IMAGE" sh -euc '
            npm i -g "pnpm@$0" >/dev/null 2>&1
            pnpm audit --audit-level high
          ' "$PNPM_VERSION"
      - name: Dependencies, secrets and configuration (Trivy)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --exit-code 1 \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignorefile .trivyignore --skip-dirs web/node_modules .
      - name: Secrets in the whole history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --no-banner --redact

  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build both images
        run: |
          docker build -f deploy/Dockerfile -t portunus:check .
          docker build -f deploy/Dockerfile --target node -t portunus-node:check .
      - name: Scan both images (Trivy)
        run: |
          for image in portunus:check portunus-node:check; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              "$TRIVY_IMAGE" image --exit-code 1 --severity HIGH,CRITICAL --ignorefile /.trivyignore "$image"
          done

  dast:
    name: dast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the panel from its image
        run: |
          docker build -f deploy/Dockerfile -t portunus:check .
          docker network create dast
          docker run -d --name panel --network dast -e PORTUNUS_LISTEN=0.0.0.0:2053 -e PORTUNUS_UPDATE_CHECK=off portunus:check
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' panel)" = healthy ] && exit 0
            sleep 2
          done
          docker logs panel; exit 1
      # ZAP looks at every page and answer it reaches without signing in.
      # Every warning fails the check, except those accepted with a reason in
      # .zap/rules.tsv; all it noted is in the report.
      - name: Probe it from outside (OWASP ZAP baseline)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network dast -v "$PWD/zap:/zap/wrk" -v "$PWD/.zap/rules.tsv:/zap/rules.tsv:ro" "$ZAP_IMAGE" \
            zap-baseline.py -t http://panel:2053/ -m 2 -c /zap/rules.tsv -r report.html -J report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-report
          path: zap/
          retention-days: 14
