# Scans the published images once a week: vulnerabilities are found in
# software that was clean on the day it was released. A failed run means the
# newest release has a HIGH or CRITICAL finding and should be rebuilt (bump
# the affected base image or dependency, then tag a new version).
name: scan published images

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [portunus, portunus-node]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan ghcr.io/portunus-org/${{ matrix.image }}:latest
        run: |
          docker pull ghcr.io/portunus-org/${{ matrix.image }}:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /.trivyignore ghcr.io/portunus-org/${{ matrix.image }}:latest
