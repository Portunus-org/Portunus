# Updates of the dependencies come as pull requests into dev, once a week,
# and go through every check like any other change. A version is taken only
# once it has been out for a week: a release pushed by someone who took over
# a package is usually found and pulled by then.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    target-branch: dev
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
